services:
  - type: web
    name: pantry-tracker-api
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    disk:
      name: pantry-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/pantry.db
      - key: CORS_ORIGINS
        value: "*"
